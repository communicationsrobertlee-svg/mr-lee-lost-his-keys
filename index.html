<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Mr Lee Lost His Keys!</title><style>html,body,#game{margin:0;width:100%;height:100%;border:0;overflow:hidden;background:#111b2a}#loading{position:fixed;inset:0;display:grid;place-items:center;color:white;font:700 22px system-ui}</style></head><body><div id="loading">Loading Mr Lee…</div><iframe id="game" allow="autoplay; fullscreen" style="display:none"></iframe><script>const files=['chunks/part00.txt','chunks/part01.txt','chunks/part02.txt','chunks/part03.txt','chunks/part04.txt','chunks/part05.txt','chunks/part06.txt','chunks/part07.txt'];Promise.all(files.map(f=>fetch(f).then(r=>{if(!r.ok)throw Error(f);return r.text()}))).then(p=>{const g=document.getElementById('game');g.srcdoc=p.join('');g.style.display='block';document.getElementById('loading').remove()}).catch(e=>document.getElementById('loading').textContent='Game failed to load: '+e);</script></body></html>

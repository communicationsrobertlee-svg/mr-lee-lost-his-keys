<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#111b2a"><title>Mr Lee Lost His Keys!</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111b2a}#loading{position:fixed;inset:0;display:grid;place-items:center;color:white;font:700 22px system-ui;text-align:center;padding:24px}</style></head><body><div id="loading">Loading Mr Lee…</div><script>(()=>{const files=['chunks/part00.txt','chunks/part01.txt','chunks/part02.txt','chunks/part03.txt','chunks/part04.txt','chunks/part05.txt','chunks/part06.txt','chunks/part07.txt'];Promise.all(files.map(f=>fetch(f+'?v=universal-classroom-1',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(f);return r.text()}))).then(parts=>{document.open();document.write(parts.join(''));document.close()}).catch(e=>{document.getElementById('loading').innerHTML='Game failed to load.<br><small>'+String(e)+'</small>'})})();</script></body></html>

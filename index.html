<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Mr Lee Lost His Keys!</title><style>html,body,#game{margin:0;width:100%;height:100%;border:0;overflow:hidden;background:#111b2a}#loading{position:fixed;inset:0;display:grid;place-items:center;color:white;font:700 22px system-ui}</style></head><body><div id="loading">Loading Mr Lee…</div><iframe id="game" allow="autoplay; fullscreen" style="display:none"></iframe><script>const files=['chunks/part00.txt','chunks/part01.txt','chunks/part02.txt','chunks/part03.txt','chunks/part04.txt','chunks/part05.txt','chunks/part06.txt','chunks/part07.txt'];Promise.all(files.map(f=>fetch(f).then(r=>{if(!r.ok)throw Error(f);return r.text()}))).then(p=>{let html=p.join('');const audioPatch=`let gameAudioCtx=null;
function unlockGameAudio(){

function pickupChime(){
  try{unlockGameAudio();if(!gameAudioCtx)return;const now=gameAudioCtx.currentTime;[660,880].forEach((f,i)=>{const o=gameAudioCtx.createOscillator(),g=gameAudioCtx.createGain();o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(.0001,now+i*.07);g.gain.exponentialRampToValueAtTime(.16,now+i*.07+.01);g.gain.exponentialRampToValueAtTime(.0001,now+i*.07+.12);o.connect(g);g.connect(gameAudioCtx.destination);o.start(now+i*.07);o.stop(now+i*.07+.13)})}catch(e){}
}
function speakIndonesianNumber(word){
  pickupChime();
  try{if(!("speechSynthesis" in window))return;const synth=window.speechSynthesis;const go=()=>{try{synth.cancel();const u=new SpeechSynthesisUtterance(word);const voices=synth.getVoices();const idVoice=voices.find(v=>/^id([-_]|$)/i.test(v.lang))||voices.find(v=>/indones/i.test(v.name));if(idVoice){u.voice=idVoice;u.lang=idVoice.lang}else u.lang="id-ID";u.rate=.78;u.pitch=1;u.volume=1;synth.speak(u)}catch(e){}};const voices=synth.getVoices();if(voices.length)go();else{let done=false;const handler=()=>{if(done)return;done=true;go()};if(synth.addEventListener)synth.addEventListener("voiceschanged",handler,{once:true});else synth.onvoiceschanged=handler;setTimeout(()=>{if(!done){done=true;go()}},250)}}catch(e){}
}`;html=html.replace(/function speakIndonesianNumber\(word\)\{[\s\S]*?\n\}\n\nfunction updateHUD/,audioPatch+'\n\nfunction updateHUD');html=html.replace('startBtn.onclick=()=>{','startBtn.onclick=()=>{\n  unlockGameAudio();');const g=document.getElementById('game');g.srcdoc=html;g.style.display='block';document.getElementById('loading').remove()}).catch(e=>document.getElementById('loading').textContent='Game failed to load: '+e);</script></body></html>

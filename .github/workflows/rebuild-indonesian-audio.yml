name: Rebuild Indonesian Number Audio

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rebuild-indonesian-audio.yml'

permissions:
  contents: write

jobs:
  build-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Indonesian speech tools
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak ffmpeg
      - name: Generate all 11 number recordings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audio/v5 /tmp/mrlee-audio
          for word in nol satu dua tiga empat lima enam tujuh delapan sembilan sepuluh; do
            espeak -v id -s 112 -p 48 -a 190 -w "/tmp/mrlee-audio/${word}.wav" "$word"
            ffmpeg -y -loglevel error \
              -i "/tmp/mrlee-audio/${word}.wav" \
              -af 'apad=pad_dur=0.50' \
              -t 2.2 -ar 22050 -ac 1 -codec:a libmp3lame -b:a 40k \
              "audio/v5/${word}.mp3"
          done
          printf '%s\n' 'Indonesian number audio generated together with espeak -v id; speed 112; pitch 48; 500ms trailing silence.' > audio/v5/README.txt
      - name: Verify every number exists and has tail room
        shell: bash
        run: |
          set -euo pipefail
          for word in nol satu dua tiga empat lima enam tujuh delapan sembilan sepuluh; do
            test -s "audio/v5/${word}.mp3"
            ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "audio/v5/${word}.mp3"
          done
          echo 'SATU phonemes:'
          espeak -q -v id --ipa satu
          echo 'TUJUH phonemes:'
          espeak -q -v id --ipa tujuh
      - name: Commit complete audio set
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audio/v5
          if git diff --cached --quiet; then
            echo 'Audio already current.'
          else
            git commit -m 'Rebuild complete Indonesian number audio set'
            git push
          fi
